name: Deploy Motion90s to GitHub Pages

on:
  push:
    branches: [main, krausemapkin-stack-motion90s-mvp]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "admin.css"
      - "admin.html"
      - "admin.js"
      - "admin-utils.js"
      - "app.js"
      - "build-pages.mjs"
      - "catalog.js"
      - "index.html"
      - "package.json"
      - "styles.css"
      - "youtube-import.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run catalog and import tests
        run: npm test

      - name: Build static site
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
